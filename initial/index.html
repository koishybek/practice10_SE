<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 204 availability (initial)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .5rem 0; }
  .ok { color: #1d6b3a; } .bad { color: #a12a2a; } .conflict { color: #a12a2a; font-weight: 600; }
  #hint { color: #8a5a00; min-height: 1.2em; }
</style>
<script src="app.js"></script>
</head>
<body>
  <h1>Room 204 availability</h1>
  <p>Current time: 9 November 2026, 09:00</p>
  <form id="form">
    <label>Date <input type="date" name="date" value="2026-11-09"></label>
    <label>Start <input type="time" name="start"></label>
    <label>End <input type="time" name="end"></label>
    <p id="hint" aria-live="polite"></p>
    <button type="submit">Check availability</button>
  </form>
  <p id="result" aria-live="polite"></p>
  <h2>Bookings</h2>
  <ul id="schedule"></ul>
</body>
</html>
